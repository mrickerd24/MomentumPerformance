<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Momentum Performance</title>
  <link rel="stylesheet" href="styles.css" />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" href="favicon.ico" type="image/x-icon" />
  <style>

  /* Non-today day cards in week view — white background, subtle blue
     border. Calmer look than the saturated pale-blue fill. Stat pills
     stay neutral gray; only the day name and number pop blue. */
  .week-day-card:not(.today) {
    background: #fff !important;
    border: 1.5px solid #B5D4F4 !important;
    box-shadow: none !important;
    color: #172B4D !important;
  }
  .week-day-card:not(.today) .week-day-card-weekday,
  .week-day-card:not(.today) .week-day-card-stat-num {
    color: #185FA5 !important;
  }
  .week-day-card:not(.today) .week-day-card-date {
    color: #5E6C84 !important;
  }
  /* Stat pills inside non-today cards — neutral gray, calm */
  .week-day-card:not(.today) .week-day-card-stat {
    background: var(--color-surface-subtle) !important;
    border-color: transparent !important;
  }
  .week-day-card:not(.today) .week-day-card-stat-label {
    color: #5E6C84 !important;
  }
  .week-day-card:not(.today) .week-day-card-empty {
    color: #8993A4 !important;
  }

  #addIceSlotModal {
  display: none;
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(9, 30, 66, 0.54);
  z-index: 9999;
  justify-content: center;
  align-items: center;
  }

  #addIceSlotModal.open {
  display: flex;
  }

  #addSessionModal {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(9, 30, 66, 0.54);
    z-index: 9999;
    justify-content: center;
    align-items: center;
  }
  #addSessionModal.open {
    display: flex;
  }

  #sessionsInSlotModal {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(9, 30, 66, 0.54);
    z-index: 9999;
    justify-content: center;
    align-items: center;
  }
  #sessionsInSlotModal.open {
    display: flex;
  }
  #sessionsInSlotList {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-top: 4px;
  }
  .sis-session-item {
    display: flex;
    align-items: stretch;
    border-radius: 8px;
    overflow: hidden;
    cursor: pointer;
    background: var(--color-accent-soft);
    border: 1px solid var(--color-accent-border);
    transition: background 0.15s;
  }
  .sis-session-item:hover {
    background: #EFE3FF;
  }
  .sis-session-bar {
    width: 4px;
    flex-shrink: 0;
  }
  .sis-session-body {
    padding: 8px 10px;
    flex: 1;
    min-width: 0;
  }
  .sis-session-name {
    font-size: 13px;
    font-weight: 700;
    color: #172B4D;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .sis-session-meta {
    font-size: 11px;
    color: #5E6C84;
    margin-top: 2px;
  }
  .sis-empty {
    font-size: 13px;
    color: #5E6C84;
    padding: 12px 4px;
    text-align: center;
  }
  .add-session-modal-card {
    background: #fff;
    border-radius: var(--radius-lg);
    padding: 28px 24px;
    width: calc(100% - 48px);
    max-width: 380px;
    box-shadow: var(--shadow-card-strong);
    max-height: 80vh;
    overflow-y: auto;
  }
  .add-session-modal-card h3 {
    color: var(--color-accent);
    margin: 0 0 16px 0;
  }

  /* ── Patch picker inside session modal ── */
  .session-patch-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin: 6px 0 4px 0;
  }
  .session-patch-card {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 10px 12px;
    border: 1px solid #DFE1E6;
    border-radius: 8px;
    background: #fff;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
  }
  .session-patch-card:hover {
    background: var(--color-accent-soft);
  }
  .session-patch-card.selected {
    border-color: var(--color-accent);
    background: var(--color-accent-soft);
    box-shadow: 0 0 0 2px rgba(109,48,166,0.15) inset;
  }
  .session-patch-card-main {
    display: flex;
    flex-direction: column;
    min-width: 0;
    flex: 1;
  }
  .session-patch-card-time {
    font-size: 13px;
    font-weight: 700;
    color: #172B4D;
  }
  .session-patch-card-rink {
    font-size: 11px;
    color: #5E6C84;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .session-patch-empty {
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 12px;
    border: 1px dashed #C1C7D0;
    border-radius: 8px;
    background: #F7F8F9;
    color: #5E6C84;
    font-size: 13px;
    text-align: center;
  }
  .session-patch-empty button {
    width: 100%;
    margin-top: 4px;
  }

  /* ── Ice slot capacity indicator (progress bar) ── */
  .ice-slot-capacity {
    margin-top: 4px;
    padding: 4px 2px;
    border-radius: 6px;
    transition: background 0.15s ease;
  }
  .ice-slot-capacity:hover {
    background: rgba(109, 48, 166, 0.06);
  }
  .ice-slot-capacity:active {
    background: rgba(109, 48, 166, 0.12);
  }
  .ice-slot-capacity-bar {
    height: 6px;
    background: #fff;
    border-radius: 999px;
    overflow: hidden;
    border: 1px solid #EBE3F7;
  }
  .ice-slot-capacity-fill {
    height: 100%;
    background: var(--color-accent);
    border-radius: 999px;
    transition: width 0.25s ease;
  }
  .ice-slot-capacity-caption {
    display: flex;
    justify-content: space-between;
    font-size: 10px;
    color: #5E6C84;
    margin-top: 4px;
    font-weight: 500;
    line-height: 1.2;
  }
  .ice-slot-capacity-caption strong {
    color: #172B4D;
    font-weight: 600;
  }
  /* Over-capacity state — red fill + red numbers */
  .ice-slot-capacity.over .ice-slot-capacity-bar {
    border-color: #F3C7C2;
  }
  .ice-slot-capacity.over .ice-slot-capacity-fill {
    background: #C9372C;
    width: 100% !important;
  }
  .ice-slot-capacity.over .ice-slot-capacity-caption,
  .ice-slot-capacity.over .ice-slot-capacity-caption strong {
    color: #C9372C;
  }

  /* ── View session modal (read-only, for skaters) ── */
  #viewSessionModal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(9, 30, 66, 0.54);
    z-index: 1000;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }
  #viewSessionModal.open {
    display: flex;
  }
  .view-session-grid {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin: 8px 0 18px;
  }
  .vs-row {
    display: flex;
    align-items: baseline;
    gap: 12px;
    padding: 8px 0;
    border-bottom: 1px solid #EBECF0;
  }
  .vs-row:last-child {
    border-bottom: none;
  }
  .vs-row-block {
    flex-direction: column;
    align-items: flex-start;
    gap: 4px;
  }
  .vs-label {
    font-size: 11px;
    font-weight: 600;
    color: #5E6C84;
    text-transform: uppercase;
    letter-spacing: 0.4px;
    flex: 0 0 110px;
  }
  .vs-value {
    font-size: 14px;
    color: #172B4D;
    font-weight: 500;
    flex: 1;
  }
  .vs-value-block {
    flex: none;
    width: 100%;
    font-weight: 400;
    line-height: 1.5;
    white-space: pre-wrap;
    background: #F7F8F9;
    padding: 10px 12px;
    border-radius: 8px;
  }
  .vs-my-note {
    margin-top: 8px;
    padding: 14px;
    background: #F7F8F9;
    border-radius: 10px;
    border: 1px solid #EBECF0;
  }
  .vs-my-note label {
    font-size: 13px;
    font-weight: 600;
    color: #172B4D;
    display: block;
  }
  .vs-my-note-hint {
    font-size: 11px;
    color: #5E6C84;
    margin-top: 2px;
    margin-bottom: 8px;
  }
  .vs-my-note textarea {
    width: 100%;
    border: 1px solid #DFE1E6;
    border-radius: 6px;
    padding: 8px 10px;
    font-family: inherit;
    font-size: 14px;
    resize: vertical;
    min-height: 60px;
    background: #fff;
  }
  .vs-my-note textarea:focus {
    outline: none;
    border-color: var(--color-border-focus);
    box-shadow: var(--shadow-focus);
  }

  /* ── Participant notes list (coach view inside edit modal) ── */
  .participant-notes-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-top: 6px;
  }
  .participant-note-item {
    background: #F7F8F9;
    border-radius: 8px;
    padding: 8px 10px;
    border-left: 3px solid var(--color-brand);
  }
  .participant-note-name {
    font-size: 11px;
    font-weight: 600;
    color: #5E6C84;
    text-transform: uppercase;
    letter-spacing: 0.4px;
    margin-bottom: 2px;
  }
  .participant-note-text {
    font-size: 13px;
    color: #172B4D;
    line-height: 1.4;
    white-space: pre-wrap;
  }
</style>
</head>
<body>

<main class="app-main">
  <div class="container">
    

        <div class="form-box">
            <div id="view-toggle">
                <button class="view-btn" id="btn-month" data-key="monthView">Month</button>
                <button class="view-btn" id="btn-week" data-key="weekView">Week</button>
                <button class="view-btn" id="btn-day" data-key="dayView">Day</button>
            </div>

            <div id="period-nav">
                <button id="prev-btn">&#8592;</button>
                <span id="period-label"></span>
                <button id="next-btn">&#8594;</button>
            </div>
            <div id="calendar-grid"></div>

      <hr style="border: none; border-top: 1px solid #DFE1E6; margin: 8px 0 20px 0;">
      <button type="button" id="openAddSessionModal" class="btn-outlined-purple" data-key="addSession">Add a session</button>
      <br><br>
      <hr style="border: none; border-top: 1px solid #DFE1E6; margin: 8px 0 20px 0;">
      <button type="button" id="openAddIceSlotModal" class="btn-outlined-blue" data-key="addIceSlot">Add ice slot</button>
      <br><br>
      <hr id="availabilityHr" style="display:none; border: none; border-top: 1px solid #DFE1E6; margin: 8px 0 20px 0;">
      <button type="button" id="openAvailabilityModal" style="display:none;" class="btn-outlined-purple" data-key="addAvailability">Add availability</button>
      <div id="availabilitySlotsSection" style="display:none; margin-top:12px;">
        <div id="availabilitySlotsList"></div>
      </div>
      <br><br>
        </div>
      


    
  </div>
</main>

<nav class="bottom-nav">
  <button class="nav-item" id="dashboard-btn">
    <img src="dashboardIcon.png" class="icon" />
    <span data-key="dashboard">Dashboard</span>
  </button>
  <button class="nav-item" id="calendar-btn">
    <img src="calendarIcon.png" class="icon" />
    <span data-key="calendar">Calendar</span>
  </button>
  <button class="nav-item" id="payment-btn">
    <img src="paymentIcon.png" class="icon" />
    <span data-key="payment">Payment</span>
  </button>
  <button class="nav-item" id="settings-btn">
    <img src="settings.png" class="icon" />
    <span data-key="settings">Settings</span>
  </button>
  <button class="nav-item" id="logout-btn">
    <img src="logout.png" class="icon" />
    <span data-key="logout">Logout</span>
  </button>
</nav>

<footer class="app-footer">
  <br><br>
  <div class="footer-content">
    <span>© 2026 Momentum Performance</span>
  </div>
</footer>

<!-- Session Modal — placed at body root so position:fixed is never clipped -->
<div id="addSessionModal">
  <div class="add-session-modal-card">
    <h3 data-key="addSession">Add a session</h3>

    <label for="sessionDate" data-key="sessionDate">Date</label><br>
    <input type="date" id="sessionDate" /><br><br>

    <label data-key="iceSlot">Ice patch</label><br>
    <div id="sessionPatchList" class="session-patch-list"></div>
    <!-- Hidden inputs still drive saveSession; they are populated when a patch card is tapped -->
    <input type="hidden" id="iceStart" />
    <input type="hidden" id="iceEnd" />
    <br>

    <label for="sessionDuration" data-key="duration">Duration (minutes)</label><br>
    <input type="number" id="sessionDuration" min="1" placeholder="60" /><br><br>

    <div id="subCoachRow">
    <label for="sessionSubCoach" data-key="subCoach">Affiliate coach</label><br>
    <select id="sessionSubCoach"></select><br><br>
    </div>

    <label data-key="sessionType">Session type</label><br>
    <div class="row" style="gap:8px; flex-wrap:wrap;">
      <!-- Private and Group are mutually exclusive (a session is one or the
           other), so they share a radio group. Off-ice is independent and
           can combine with either, so it stays a checkbox. -->
      <label><input type="radio" name="sessionType" id="typePrivate" value="private" /> <span data-key="private">Private</span></label>
      <label><input type="radio" name="sessionType" id="typeGroup" value="group" /> <span data-key="group">Group</span></label>
      <label><input type="checkbox" id="typeOffIce" value="off-ice" /> <span data-key="offIce">Off-ice</span></label>
    </div><br>

    <div id="pricingBlock">
      <!-- Pricing block: coach picks hourly vs flat; the amount comes from
           paymentSettings/{coachUid}. The dashboard earnings tiles read the
           derived priceMode + priceAmount off each session. -->
      <label data-key="pricing">Pricing</label><br>
      <div class="row" style="gap:8px; flex-wrap:wrap;">
        <label><input type="radio" name="priceMode" id="priceModeHourly" value="hourly" checked /> <span data-key="priceModeHourly">Hourly</span></label>
        <label><input type="radio" name="priceMode" id="priceModeFlat"   value="flat" /> <span data-key="priceModeFlat">Flat</span></label>
      </div>
      <!-- Live total preview. Shown only when rate + duration + attendees
           are all known. Computed by updatePricingPreview() in calendar.js
           and kept in sync as the coach edits any of those inputs. The flex
           layout is applied in JS when the preview becomes visible. -->
      <div id="pricingPreview" style="display:none; font-size:13px; color:#5E6C84; margin-top:6px; justify-content:space-between; align-items:center;">
        <span data-key="totalBillable">Total billable</span>
        <span id="pricingPreviewValue" style="font-weight:500; color:#172B4D;">—</span>
      </div>
    </div>
    <br><br>

    <label data-key="participants">Participants</label>
    <div id="session-participants"></div><br>

    <label for="sessionNotes" data-key="sessionNotes">Notes (optional)</label><br>
    <input type="text" id="sessionNotes" /><br><br>

    <div id="participantNotesSection" style="display:none; margin-bottom: 14px;">
      <label data-key="participantNotes">Notes from participants</label>
      <div id="participantNotesList" class="participant-notes-list"></div>
    </div>

    <div id="deleteSessionBtn-row" style="display:none; margin-bottom:10px;">
      <button type="button" id="deleteSessionBtn" class="btn-danger" data-key="deleteSession">Delete session</button>
    </div>
    <div class="modal-btn-row">
      <button type="button" id="cancelSessionBtn" class="btn-cancel" data-key="cancel">Cancel</button>
      <button type="button" id="saveSessionBtn" class="btn-primary-purple" data-key="saveSession">Save session</button>
      <input type="hidden" id="editSessionId" value="" />
    </div>
  </div>
</div>

<!-- Session View Modal — read-only view for skaters, with editable "my note" field -->
<div id="viewSessionModal">
  <div class="add-session-modal-card">
    <h3 data-key="sessionDetails">Session details</h3>
    <input type="hidden" id="viewSessionId" value="" />

    <div class="view-session-grid">
      <div class="vs-row">
        <span class="vs-label" data-key="sessionDate">Date</span>
        <span class="vs-value" id="vsDate">—</span>
      </div>
      <div class="vs-row">
        <span class="vs-label" data-key="time">Time</span>
        <span class="vs-value" id="vsTime">—</span>
      </div>
      <div class="vs-row">
        <span class="vs-label" data-key="rink">Rink</span>
        <span class="vs-value" id="vsRink">—</span>
      </div>
      <div class="vs-row">
        <span class="vs-label" data-key="duration">Duration</span>
        <span class="vs-value" id="vsDuration">—</span>
      </div>
      <div class="vs-row">
        <span class="vs-label" data-key="sessionType">Type</span>
        <span class="vs-value" id="vsType">—</span>
      </div>
      <div class="vs-row">
        <span class="vs-label" data-key="participants">Participants</span>
        <span class="vs-value" id="vsParticipants">—</span>
      </div>
      <div class="vs-row">
        <span class="vs-label" data-key="coach">Coach</span>
        <span class="vs-value" id="vsCoach">—</span>
      </div>
      <div class="vs-row vs-row-block" id="vsCoachNotesRow">
        <span class="vs-label" data-key="coachNotes">Coach's notes</span>
        <div class="vs-value vs-value-block" id="vsCoachNotes">—</div>
      </div>
    </div>

    <div id="vsParticipantNotesSection" style="display:none; margin-top:8px;">
      <div class="participant-notes-list" id="vsParticipantNotesList"></div>
    </div>

    <div class="vs-my-note">
      <label for="vsMyNote" data-key="myNote">My note</label>
      <div class="vs-my-note-hint" data-key="myNoteHint">Visible to you and your coach</div>
      <textarea id="vsMyNote" rows="3" placeholder="Add a note for your coach…"></textarea>
    </div>

    <div class="modal-btn-row">
      <button type="button" id="editViewSessionBtn" class="btn-primary-purple" data-key="editSession" style="display:none;">Edit session</button>
      <button type="button" id="deleteViewSessionBtn" class="btn-danger" data-key="deleteSession" style="display:none;">Delete session</button>
      <button type="button" id="closeViewSessionBtn" class="btn-cancel" data-key="close">Close</button>
      <button type="button" id="saveMyNoteBtn" class="btn-primary-purple" data-key="saveNote">Save note</button>
    </div>
  </div>
</div>

<!-- Ice Slot Modal — placed at body root -->
<div id="addIceSlotModal">
  <div class="add-session-modal-card">
    <h3 data-key="addIceSlot">Add ice slot</h3>
    <input type="hidden" id="editIceSlotId" value="" />

    <label for="slotRinkSearch" data-key="rink">Rink</label><br>
    <input type="hidden" id="slotRink" />
    <input type="text" id="slotRinkSearch" autocomplete="off" /><br>
    <div id="slotRink-results"></div><br>

    <label data-key="iceSlot">Ice slot</label><br>
    <div class="row">
      <input type="time" id="slotStart" />
      <input type="time" id="slotEnd" />
    </div><br>

    <label for="slotStartDate" data-key="slotStartDate">Start date</label><br>
    <input type="date" id="slotStartDate" /><br><br>

    <label for="slotEndDate" data-key="slotEndDate">End date (optional)</label><br>
    <input type="date" id="slotEndDate" /><br><br>

    <label data-key="recurrence">Recurrence</label><br>
    <select id="slotRecurrence">
      <option value="once" data-key="recurrenceOnce">Once</option>
      <option value="weekly" data-key="recurrenceWeekly">Weekly</option>
      <option value="biweekly" data-key="recurrenceBiweekly">Bi-weekly</option>
      <option value="monthly" data-key="recurrenceMonthly">Monthly</option>
    </select><br><br>

    <div id="slotDays-row">
      <label data-key="recurrenceDays">Repeat on</label><br>
      <div style="display:flex; gap:6px; flex-wrap:wrap; margin-top:6px;">
        <label><input type="checkbox" name="slotDay" value="0" /> Sun</label>
        <label><input type="checkbox" name="slotDay" value="1" /> Mon</label>
        <label><input type="checkbox" name="slotDay" value="2" /> Tue</label>
        <label><input type="checkbox" name="slotDay" value="3" /> Wed</label>
        <label><input type="checkbox" name="slotDay" value="4" /> Thu</label>
        <label><input type="checkbox" name="slotDay" value="5" /> Fri</label>
        <label><input type="checkbox" name="slotDay" value="6" /> Sat</label>
      </div><br>
    </div>

    <div id="deleteIceSlotBtn-row" style="display:none; margin-bottom:10px;">
      <button type="button" id="deleteIceSlotBtn" class="btn-danger" data-key="deleteIceSlot">Delete ice slot</button>
    </div>
    <div class="modal-btn-row">
      <button type="button" id="cancelIceSlotBtn" class="btn-cancel" data-key="cancel">Cancel</button>
      <button type="button" id="saveIceSlotBtn" class="btn-primary-blue" data-key="saveIceSlot">Save ice slot</button>
    </div>
  </div>
</div>

<!-- Sessions-in-patch modal — lists every session that belongs to a given ice patch -->
<div id="sessionsInSlotModal">
  <div class="add-session-modal-card">
    <h3 id="sessionsInSlotTitle" data-key="sessionsInPatch">Sessions in this patch</h3>
    <div id="sessionsInSlotList"></div>
    <div class="modal-btn-row" style="margin-top:14px;">
      <button type="button" id="closeSessionsInSlotBtn" class="btn-cancel" data-key="close">Close</button>
      <button type="button" id="editPatchFromListBtn" class="btn-primary-blue" data-key="editIceSlot">Edit patch</button>
    </div>
  </div>
</div>

<!-- Availability Modal (affiliate coaches only) -->
<div id="availabilityModal" class="modal-overlay" style="display:none; position:fixed; inset:0; background:rgba(23,43,77,0.55); z-index:1000; align-items:center; justify-content:center; padding:16px;">
  <div class="add-session-modal-card">
    <h3 id="availabilityModalTitle" data-key="addAvailability">Add availability</h3>
    <label for="availDay" data-key="availabilityDay">Day</label><br>
    <select id="availDay" style="width:100%; padding:8px; border:1px solid #DFE1E6; border-radius:4px; font-size:14px; margin-bottom:12px;">
      <option value="monday" data-key="monday">Monday</option>
      <option value="tuesday" data-key="tuesday">Tuesday</option>
      <option value="wednesday" data-key="wednesday">Wednesday</option>
      <option value="thursday" data-key="thursday">Thursday</option>
      <option value="friday" data-key="friday">Friday</option>
      <option value="saturday" data-key="saturday">Saturday</option>
      <option value="sunday" data-key="sunday">Sunday</option>
    </select><br>
    <label for="availFrom" data-key="availabilityFrom">From</label><br>
    <input type="time" id="availFrom" style="width:100%; padding:8px; border:1px solid #DFE1E6; border-radius:4px; font-size:14px; margin-bottom:12px;" /><br>
    <label for="availTo" data-key="availabilityTo">To</label><br>
    <input type="time" id="availTo" style="width:100%; padding:8px; border:1px solid #DFE1E6; border-radius:4px; font-size:14px;" /><br><br>
    <div class="modal-btn-row">
      <button id="deleteAvailabilityBtn" type="button" class="btn-danger" style="display:none; margin-right:auto;" data-key="delete">Delete</button>
      <button id="cancelAvailabilityBtn" type="button" class="btn-cancel" data-key="cancel">Cancel</button>
      <button id="saveAvailabilityBtn" type="button" class="btn-primary-purple" data-key="save">Save</button>
    </div>
  </div>
</div>

<script type="module" src="calendar.js"></script>
</body>
</html>
