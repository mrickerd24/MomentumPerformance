<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Momentum Performance</title>
  <link rel="stylesheet" href="styles.css" />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" href="favicon.ico" type="image/x-icon" />
  <style>
    #deleteModal {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(9, 30, 66, 0.54);
      z-index: 9999;
      justify-content: center;
      align-items: center;
    }
    #deleteModal.open {
      display: flex;
    }
    .delete-modal-card {
      background: #fff;
      border-radius: var(--radius-lg);
      padding: 28px 24px;
      width: calc(100% - 48px);
      max-width: 380px;
      box-shadow: var(--shadow-card-strong);
    }
    .delete-modal-card h3 {
      color: #C9372C;
      margin: 0 0 10px 0;
    }
    .delete-modal-card p {
      font-size: 13px;
      color: #5E6C84;
      margin: 0 0 16px 0;
    }
    .delete-modal-card input {
      width: 100%;
      margin-bottom: 8px;
    }
    .modal-btn-row {
      display: flex;
      gap: 10px;
      margin-top: 14px;
    }
    .modal-btn-row button {
      flex: 1;
    }
  </style>
</head>
<body>

<main class="app-main">
  <div class="container">
    <div class="form-box">

      <form id="accountSettingsForm">

        <h2 id="accountSettings" data-key="accountSettings">Account settings</h2>

        <!-- Language -->
        <legend data-key="langselect">Preferred language</legend><br>
        <div class="language-option">
          <input type="radio" name="language" value="en" id="english-language" />
          <label for="english-language" data-key="english">English</label>
        </div><br>
        <div class="language-option">
          <input type="radio" name="language" value="fr" id="french-language" />
          <label for="french-language" data-key="french">French</label>
        </div><br><br>

        <!-- Name row -->
        <div class="row">
          <div>
            <label for="name" data-key="name">Name</label><br>
            <input type="text" id="name" placeholder="Name" autocomplete="name" />
            <div id="name-error" class="field-error"></div>
          </div>
          <div>
            <label for="lastName" data-key="lastName">Last Name</label><br>
            <input type="text" id="lastName" placeholder="Last name" autocomplete="family-name" />
            <div id="lastName-error" class="field-error"></div>
          </div>
        </div><br>

        <!-- Parent name — shown for skater_parent only -->
        <div id="parentName-row">
          <label for="parentName" data-key="parentName">Parent name (optional)</label><br>
          <input type="text" id="parentName" placeholder="Parent name" autocomplete="additional-name" />
          <br><br>
        </div>

        <!-- Email + Phone -->
        <div class="row">
          <div>
            <label for="emailAddress" data-key="email">Email</label><br>
            <input type="email" id="emailAddress" placeholder="Email address" autocomplete="email" />
            <div id="emailAddress-error" class="field-error"></div>
          </div>
          <div>
            <label for="phoneNumber" data-key="phoneNumber">Phone number</label><br>
            <input type="tel" id="phoneNumber" placeholder="XXX-XXX-XXXX" autocomplete="tel" />
            <div id="phoneNumber-error" class="field-error"></div>
          </div>
        </div><br>

        <!-- Week start day (checkboxes — Days of the week) — coach only -->
        <div id="weekStart-row">
          <label data-key="weekStart">What day does your week start</label><br><br>
          <div class="row">
            <div class="day-option" style="flex:1;">
              <input type="radio" name="day" value="monday" id="monday" />
              <label for="monday" data-key="monday">Monday</label>
            </div>
            <div class="day-option" style="flex:1;">
              <input type="radio" name="day" value="tuesday" id="tuesday" />
              <label for="tuesday" data-key="tuesday">Tuesday</label>
            </div>
          </div><br>
          <div class="row">
            <div class="day-option" style="flex:1;">
              <input type="radio" name="day" value="wednesday" id="wednesday" />
              <label for="wednesday" data-key="wednesday">Wednesday</label>
            </div>
            <div class="day-option" style="flex:1;">
              <input type="radio" name="day" value="thursday" id="thursday" />
              <label for="thursday" data-key="thursday">Thursday</label>
            </div>
          </div><br>
          <div class="row">
            <div class="day-option" style="flex:1;">
              <input type="radio" name="day" value="friday" id="friday" />
              <label for="friday" data-key="friday">Friday</label>
            </div>
            <div class="day-option" style="flex:1;">
              <input type="radio" name="day" value="saturday" id="saturday" />
              <label for="saturday" data-key="saturday">Saturday</label>
            </div>
          </div><br>
          <div class="row">
            <div class="day-option" style="flex:1;">
              <input type="radio" name="day" value="sunday" id="sunday" />
              <label for="sunday" data-key="sunday">Sunday</label>
            </div>
            <div style="flex:1;"></div>
          </div><br><br>
        </div>



        <!-- Skate Canada number — shown for coach + skater_parent -->
        <div id="skateCan-row">
          <label for="skateCanadaNumber" data-key="skateCan">Skate Canada number</label><br>
          <input type="text" id="skateCanadaNumber" placeholder="XXXXXXXXXXX" />
          <div id="skateCanadaNumber-error" class="field-error"></div>
          <br>
        </div>

        <!-- Club search — shown for non-admin users -->
        <div id="clubSearch-row">
          <label data-key="clubs">Your skating club</label>
          <div id="selected-clubs"></div>
          <br>
          <input type="text" id="clubSearch" placeholder="Search for a club" autocomplete="off" />
          <div id="club-results"></div>
          <div id="clubSearch-error" class="field-error"></div>
          <br>
        </div>

        <!-- Club number — shown for admin only -->
        <div id="clubNum-row">
          <label for="skateCanClubNumber" data-key="skateCanClubNumber">Skate Canada club number</label><br>
          <input type="text" id="skateCanClubNumber" placeholder="XXXXXXXXXXX" />
          <div id="skateCanClubNumber-error" class="field-error"></div>
          <br>
        </div>

        <!-- Password -->
        <!-- CSS grid with two columns and three rows: labels on row 1
             (auto-sized to the tallest label so single-line and two-line
             labels share the same row height), inputs on row 2 (so they
             always align horizontally), and error messages on row 3.
             This stays even when one label wraps in French (e.g.
             "Confirmation du nouveau mot de passe") and the other
             doesn't ("Modifier le mot de passe"). -->
        <div style="display:grid; grid-template-columns:1fr 1fr; grid-template-rows:auto auto auto; column-gap:10px; width:100%;">
          <label for="changepassword"        data-key="changepw"      style="grid-column:1; grid-row:1;">Change password</label>
          <label for="passwordConfirmation"  data-key="confirmNewpw"  style="grid-column:2; grid-row:1;">Confirm new password</label>

          <input type="password" id="changepassword"        placeholder="New password"     autocomplete="new-password" style="grid-column:1; grid-row:2; margin-top:6px;" />
          <input type="password" id="passwordConfirmation"  placeholder="Confirm password" autocomplete="new-password" style="grid-column:2; grid-row:2; margin-top:6px;" />

          <div id="password-error"             class="field-error" style="grid-column:1; grid-row:3;"></div>
          <div id="passwordConfirmation-error" class="field-error" style="grid-column:2; grid-row:3;"></div>
        </div><br>

        <button type="submit" id="saveChanges" class="btn-outlined-blue" data-key="saveChanges">Save changes</button>
        <br><br>

      </form>

      <!-- Payment settings link — coach only. Visibility mirrors the
           existing #pricing-row block: shown for coaches, hidden for
           skaters/parents/admins via accountSettings.js role check. -->
      <div id="paymentSettingsLink-row" style="display:none;">
        <hr style="border: none; border-top: 1px solid #DFE1E6; margin: 8px 0 20px 0;">
        <a href="paymentSettings.html" id="paymentSettingsLink"
           style="display:inline-block; padding:10px 16px; border:1px solid var(--color-brand);
                  border-radius:8px; color:var(--color-brand); text-decoration:none;
                  font-weight:600; font-size:14px;"
           data-key="paymentSettings">Payment settings</a>
        <br><br>
      </div>

      <!-- Delete account trigger — type="button" prevents any form interaction -->
      <hr style="border: none; border-top: 1px solid #DFE1E6; margin: 8px 0 20px 0;">
      <button type="button" id="openDeleteModal" class="btn-danger" data-key="deleteAccount">Delete account</button>
      <br><br>

    </div>
  </div>
</main>

<!-- Delete account modal — toggled via .open class -->
<div id="deleteModal">
  <div class="delete-modal-card">
    <h3 data-key="deleteAccount">Delete account</h3>
    <p data-key="deleteAccountWarning">This action is permanent and cannot be undone. Type <strong>delete</strong> to confirm.</p>
    <input
      type="text"
      id="deleteConfirmInput"
      autocomplete="off"
      data-key-placeholder="deleteConfirmPlaceholder"
      placeholder='Type "delete" to confirm'
    />
    <div id="deleteConfirm-error" class="field-error"></div>
    <div class="modal-btn-row">
      <button type="button" id="cancelDeleteBtn" class="btn-cancel" data-key="cancel">Cancel</button>
      <button type="button" id="confirmDeleteBtn" class="btn-danger" data-key="deleteAccountBtn">Delete my account</button>
    </div>
  </div>
</div>

<nav class="bottom-nav">
  <button class="nav-item" id="dashboard-btn">
    <img src="dashboardIcon.png" class="icon" />
    <span data-key="dashboard">Dashboard</span>
  </button>
  <button class="nav-item" id="calendar-btn">
    <img src="calendarIcon.png" class="icon" />
    <span data-key="calendar">Calendar</span>
  </button>
  <button class="nav-item" id="payment-btn">
    <img src="paymentIcon.png" class="icon" />
    <span data-key="payment">Payment</span>
  </button>
  <button class="nav-item" id="settings-btn">
    <img src="settings.png" class="icon" />
    <span data-key="settings">Settings</span>
  </button>
  <button class="nav-item" id="logout-btn">
    <img src="logout.png" class="icon" />
    <span data-key="logout">Logout</span>
  </button>
</nav>

<footer class="app-footer">
  <br><br>
  <div class="footer-content">
    <span>© 2026 Momentum Performance</span>
  </div>
</footer>

<script type="module" src="accountSettings.js"></script>
</body>
</html>
