<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Momentum Performance</title>
  <link rel="stylesheet" href="styles.css" />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" href="favicon.ico" type="image/x-icon" />
  <style>
    .dash-session-modal-card {
      background: #fff;
      border-radius: var(--radius-lg);
      padding: 20px;
      max-width: 440px;
      width: 100%;
      max-height: 84vh;
      overflow-y: auto;
      box-shadow: var(--shadow-card-strong);
    }
    .dash-session-card {
      border: 1px solid #DFE1E6;
      border-radius: 8px;
      padding: 12px;
      background: #FAFBFC;
      margin-bottom: 8px;
    }
    .dash-session-card-top {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 6px;
    }
    .dash-session-name {
      font-size: 14px;
      font-weight: 700;
      color: #172B4D;
    }
    .dash-session-time {
      font-size: 12px;
      font-weight: 700;
      color: #0C447C;
      white-space: nowrap;
    }
    .dash-session-meta {
      font-size: 12px;
      color: #5E6C84;
      line-height: 1.45;
    }
    .subcoach-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 14px;
    }
    .subcoach-card {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      border: 1px solid #DFE1E6;
      border-radius: 8px;
      padding: 10px 12px;
      background: #FAFBFC;
    }
    .subcoach-name {
      font-size: 14px;
      font-weight: 700;
      color: #172B4D;
    }
    .subcoach-rate {
      font-size: 12px;
      color: #5E6C84;
      margin-top: 2px;
    }
    .subcoach-delete {
      border: none;
      background: none;
      color: #AE2A19;
      font: inherit;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }
    .schedule-card {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
      border: 1px solid #DFE1E6;
      border-radius: 8px;
      padding: 10px 12px;
      background: #FAFBFC;
    }
    .schedule-times {
      font-size: 12px;
      color: #5E6C84;
      margin-top: 4px;
      white-space: pre-line;
    }
    .schedule-edit-form {
      display: none;
      flex-direction: column;
      gap: 6px;
      margin-top: 8px;
    }
    .schedule-edit-form.open {
      display: flex;
    }
    .schedule-edit-form textarea {
      font: inherit;
      font-size: 13px;
      border: 1px solid #DFE1E6;
      border-radius: 6px;
      padding: 6px 8px;
      resize: vertical;
      min-height: 60px;
    }
  </style>
</head>
<body>

<main class="app-main">
  <div class="container">
    <div class="box">
      <h3 id="welcome-title">Welcome to your dashboard</h3>
      <br>
      <div id="tiles-container"></div>
      <br>
    </div>
  </div>
</main>

<div id="coachTimeWeekModal" class="modal-overlay" style="display:none; position:fixed; inset:0; background:rgba(23,43,77,0.55); z-index:1000; align-items:center; justify-content:center; padding:16px;">
  <div class="dash-session-modal-card">
    <div style="display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:14px;">
      <h3 id="coachTimeWeekModalTitle" style="margin:0; font-size:16px;"></h3>
      <button id="coachTimeWeekModalClose" type="button" style="background:none; border:none; color:#5E6C84; font-size:24px; line-height:1; cursor:pointer;">&times;</button>
    </div>
    <div id="coachTimeWeekModalList"></div>
  </div>
</div>

<div id="subCoachModal" class="modal-overlay" style="display:none; position:fixed; inset:0; background:rgba(23,43,77,0.55); z-index:1000; align-items:center; justify-content:center; padding:16px;">
  <div class="dash-session-modal-card">
    <div style="display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:14px;">
      <h3 style="margin:0; font-size:16px;" data-key="coachManagement">Coach management</h3>
      <button id="subCoachModalClose" type="button" style="background:none; border:none; color:#5E6C84; font-size:24px; line-height:1; cursor:pointer;">&times;</button>
    </div>
    <div id="subCoachList" class="subcoach-list"></div>
  </div>
</div>

<nav class="bottom-nav">
  <button class="nav-item" id="dashboard-btn">
    <img src="dashboardIcon.png" class="icon" />
    <span data-key="dashboard">Dashboard</span>
  </button>
  <button class="nav-item" id="calendar-btn">
    <img src="calendarIcon.png" class="icon" />
    <span data-key="calendar">Calendar</span>
  </button>
  <button class="nav-item" id="payment-btn">
    <img src="paymentIcon.png" class="icon" />
    <span data-key="payment">Payment</span>
  </button>
  <button class="nav-item" id="settings-btn">
    <img src="settings.png" class="icon" />
    <span data-key="settings">Settings</span>
  </button>
  <button class="nav-item" id="logout-btn">
    <img src="logout.png" class="icon" />
    <span data-key="logout">Logout</span>
  </button>
</nav>

<footer class="app-footer">
  <br><br>
  <div class="footer-content">
    <span>© 2026 Momentum Performance</span>
  </div>
</footer>

<!-- Affiliate detail modal -->
<div id="affiliateDetailModal" style="display:none; position:fixed; inset:0; background:rgba(23,43,77,0.55); z-index:1100; align-items:center; justify-content:center; padding:16px;">
  <div class="dash-session-modal-card">
    <div style="display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:16px;">
      <h3 id="affiliateDetailName" style="margin:0; font-size:16px;"></h3>
      <button id="affiliateDetailClose" type="button" style="background:none; border:none; color:#5E6C84; font-size:24px; line-height:1; cursor:pointer;">&times;</button>
    </div>
    <div id="affiliateDetailContent"></div>
  </div>
</div>

<script type="module" src="dashboard.js"></script>
</body>
</html>
